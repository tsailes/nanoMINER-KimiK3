[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanominer-k3-reproduction"
version = "0.1.0"
description = "Evidence-first nanoMINER reproduction with a Kimi K3 core agent"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "License status inherited from upstream; verify before redistribution"}
authors = [{name = "nanoMINER reproduction contributors"}]
dependencies = [
  "jsonschema>=4.23,<5",
  "openai>=1.109,<2",
  "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
nanominer-k3 = "nanominer_k3.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanominer_k3 = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
